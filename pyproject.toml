[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-tactics"
version = "0.1.0"
description = "Touchline: evidence-backed soccer match analysis from tracking data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<8"]
demo = ["imageio>=2.35", "imageio-ffmpeg>=0.6", "pillow>=10"]
cv = [
    "supervision>=0.29.1,<0.30", "ultralytics>=8.4.183,<8.5",
    "opencv-python>=5.0,<6", "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30", "gdown>=5.2,<6",
]
idsse = ["floodlight>=1.2.0"]
metrica-epts = ["kloppy>=3.17,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
