[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-tactics"
version = "0.1.0"
description = "Tracking-data analytics engine for soccer, with an LLM agent layer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
agent = ["anthropic>=0.40"]
cv = ["supervision", "ultralytics", "opencv-python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
